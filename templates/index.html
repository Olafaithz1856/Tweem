<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="static/css/auth.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mob.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TWEEM Login</title>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="TWEEM Logo" class="logo">
        <h2>Welcome <span>Back</span></h2>
        <p class="subtitle">Login to TWEEM Spiritual Counseling Bot</p>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div style="background:#ffe6e6; padding:10px; border-radius:5px;">
      {% for message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
<form method="POST">
    <input type="email" name="email" placeholder="Enter your email" required>
    <input type="password" name="password" placeholder="Enter your password" required>
    
    <button type="submit">Login</button>
    
    <!-- Forgot password link -->
    <p style="margin-top: 10px; text-align: right;">
        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
    </p>
</form>


      </button>
  <p>
    Don’t have an account?
    <a href="/register">Register</a>
  </p>

</body>
</html>
